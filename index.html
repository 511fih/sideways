<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sideways</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#e9e6dc;--panel:#f7f4ea;--ink:#1c1d20;--mute:#66625a;--acc:#c2410c;--accink:#fff;--line:#cfcabb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101214;--panel:#1a1d21;--ink:#f1eee6;--mute:#9a968b;--acc:#ffb020;--accink:#1a1300;--line:#2e3238}}
:root[data-theme="dark"]{--bg:#101214;--panel:#1a1d21;--ink:#f1eee6;--mute:#9a968b;--acc:#ffb020;--accink:#1a1300;--line:#2e3238}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:none;justify-content:space-between;padding:0 16px;pointer-events:none;font:900 26px/1.1 'Big Shoulders Display',Impact,sans-serif;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.65)}
.racing .hud{display:flex}.hud .r{text-align:right}.hud #pos{font-size:56px}#dr{color:#ffd166;height:1.1em}#dl{font-size:48px;min-height:1em}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font:900 140px 'Big Shoulders Display',Impact,sans-serif;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.6)}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 32px));box-sizing:border-box;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;max-height:92%;overflow:auto}
.hide{display:none!important}
h1,h2{margin:0;font:900 64px/.95 'Big Shoulders Display',Impact,sans-serif;letter-spacing:-.01em}h2{font-size:44px}
.sub,.note,.keys{color:var(--mute);margin:8px 0 14px}.keys{font-size:14px;margin:14px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0}
.seg{display:flex}.seg button{font:inherit;font-weight:600;padding:7px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;margin-left:-1px}
.seg button:first-child{border-radius:8px 0 0 8px;margin:0}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.on{background:var(--acc);color:var(--accink);border-color:var(--acc);position:relative}.seg button:disabled{opacity:.4;cursor:not-allowed}
.big{font:800 22px 'Big Shoulders Display',Impact,sans-serif;width:100%;padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--accink);cursor:pointer;margin-top:6px}
.alt{font:inherit;font-weight:600;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;margin-top:8px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
ol{padding:0;margin:14px 0;list-style:none}li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}li.me{font-weight:600;color:var(--acc)}
.pad{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:none;justify-content:space-between}
.pad div{display:flex;gap:8px}.pad button{width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.35);color:#fff;font:700 13px Barlow,sans-serif}
.hs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.hs h3{margin:0;font:800 22px 'Big Shoulders Display',Impact,sans-serif}.hs ol{margin:4px 0 0}.hs li{font-size:14px;padding:4px 0;gap:8px}.hs li span:last-child{color:var(--mute)}.hs li.me span:last-child{color:inherit}
@media (pointer:coarse){.racing .pad{display:flex}}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><div><div id="pos"></div><div id="lap"></div></div><div class="r"><div id="dl"></div><div id="time"></div><div id="spd"></div><div id="dr"></div></div></div>
<div id="msg"></div>
<div class="pad"><div><button data-k="l">Left</button><button data-k="r">Right</button></div><div><button data-k="d">Drift</button><button data-k="b">Brake</button><button data-k="g">Gas</button></div></div>

<div id="menu" class="panel">
<h1>Sideways</h1><p class="sub">Three laps. Hold Space to throw the car into a slide.</p>
<div class="row"><span>Opponents</span><div class="seg" data-k="ai"><button data-v="0">None</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button></div></div>
<div class="row"><span>Difficulty</span><div class="seg" data-k="diff"><button data-v="easy">Easy</button><button data-v="med">Normal</button><button data-v="hard">Hard</button></div></div>
<div class="row"><span>Race your ghost</span><div class="seg" data-k="ghost"><button data-v="0">Off</button><button data-v="1" id="gon">On</button></div></div>
<p class="note" id="gnote"></p>
<button class="big" id="go">Start race</button>
<p class="keys">Drive with arrows or WASD. Drift with Space. Respawn with R.</p>
<div class="hs" id="hs"></div>
</div>

<div id="res" class="panel hide"><h2 id="rt"></h2><p class="note" id="rn"></p><ol id="rl"></ol><div class="hs" id="hs2"></div>
<button class="big" id="again">Race again</button><button class="alt" id="tomenu">Change settings</button></div>

<script>
const $=s=>document.querySelector(s),cv=$('#c'),cx=cv.getContext('2d');
let W,H,DPR;const resize=()=>{DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR};addEventListener('resize',resize);resize();
const S=1.7,TW=190,LAPS=3,wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const ft=t=>{const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(3)};
/* track */
const P0=[[800,150],[1250,150],[1450,300],[1350,480],[1000,520],[1200,700],[1100,880],[700,900],[500,760],[620,600],[350,520],[200,380],[350,200]];
let C=[];const n0=P0.length;
for(let i=0;i<n0;i++){const p0=P0[(i+n0-1)%n0],p1=P0[i],p2=P0[(i+1)%n0],p3=P0[(i+2)%n0];
 for(let k=0;k<22;k++){const t=k/22,t2=t*t,t3=t2*t,f=(a,b,c,d)=>.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
  C.push([f(p0[0],p1[0],p2[0],p3[0])*S,f(p0[1],p1[1],p2[1],p3[1])*S])}}
const mx=Math.min(...C.map(p=>p[0]))-260,my=Math.min(...C.map(p=>p[1]))-260;C=C.map(p=>[p[0]-mx,p[1]-my]);
const N=C.length,WW=Math.ceil(Math.max(...C.map(p=>p[0]))+260),WH=Math.ceil(Math.max(...C.map(p=>p[1]))+260);
const ang=C.map((_,i)=>{const a=C[(i+N-1)%N],b=C[(i+1)%N];return Math.atan2(b[1]-a[1],b[0]-a[0])});
const trk=document.createElement('canvas'),skd=document.createElement('canvas');trk.width=skd.width=WW;trk.height=skd.height=WH;
const g=trk.getContext('2d'),sk=skd.getContext('2d');sk.strokeStyle='rgba(8,9,12,.3)';sk.lineWidth=5;sk.lineCap='round';
g.fillStyle='#2f5a43';g.fillRect(0,0,WW,WH);
for(let n=0;n<260;n++){const x=Math.random()*WW,y=Math.random()*WH,r=18+Math.random()*26;let ok=1;
 for(let i=0;i<N;i+=3)if(Math.hypot(x-C[i][0],y-C[i][1])<TW*.5+r+40){ok=0;break}
 if(ok){g.fillStyle='#244b38';g.beginPath();g.arc(x,y,r,0,7);g.fill();g.fillStyle='#2b5b43';g.beginPath();g.arc(x-r*.2,y-r*.25,r*.65,0,7);g.fill()}}
const path=()=>{g.beginPath();C.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath()};
g.lineJoin='round';path();g.lineWidth=TW+26;g.strokeStyle='#c8412c';g.stroke();
g.setLineDash([30,30]);g.strokeStyle='#f1ece0';g.stroke();g.setLineDash([]);
path();g.lineWidth=TW;g.strokeStyle='#3a3d44';g.stroke();
g.setLineDash([22,30]);g.lineWidth=4;g.strokeStyle='rgba(255,255,255,.2)';g.stroke();g.setLineDash([]);
g.save();g.translate(C[0][0],C[0][1]);g.rotate(ang[0]);
for(let r=0;r<2;r++)for(let c=0;c<10;c++){g.fillStyle=(r+c)%2?'#111':'#fff';g.fillRect(-10+r*10,-TW/2+c*TW/10,10,TW/10+.5)}g.restore();
/* state */
const cfg={ai:3,diff:'med',ghost:0},K={},T={},cam={x:0,y:0};
let cars=[],rec=[],state='menu',cd=0,raceT=0,rf=0,msg=0,dp=0,gh=null,G=null,gp=null,dsm=0,lapN=-1,lapT=0,laps=[],SC={r:[],l:[]};
try{const j=JSON.parse(localStorage.getItem('sideways-ghost'));if(j&&Array.isArray(j.d)&&j.t)G=j}catch(e){}
try{const j=JSON.parse(localStorage.getItem('sideways-scores'));if(j&&Array.isArray(j.r)&&Array.isArray(j.l))SC=j}catch(e){}
const mk=o=>Object.assign({x:0,y:0,a:0,vx:0,vy:0,idx:0,cum:0,fin:null,off:0,slip:0,pv:null,st:0,dist:0,stuck:0},o);
function setup(){
 cars=[];rec=[];dp=0;const names=['Kestrel','Mako','Vega'],cols=['#ffb020','#38bdf8','#f472b6','#a3e635'],base={easy:.74,med:.85,hard:.95}[cfg.diff];
 for(let k=0;k<=cfg.ai;k++){const idx=N-2-(k>>1)*3,a=ang[idx],sd=k&1?1:-1;
  cars.push(mk({x:C[idx][0]-Math.sin(a)*sd*38,y:C[idx][1]+Math.cos(a)*sd*38,a,idx,cum:idx-N,pl:k==0,col:cols[k],name:k?names[k-1]:'You',skill:base+(Math.random()-.5)*.06,lane:(Math.random()-.5)*70}))}
 cam.x=cars[0].x;cam.y=cars[0].y}
const pin=()=>[(K.ArrowUp||K.KeyW||T.g?1:0)-(K.ArrowDown||K.KeyS||T.b?1:0),(K.ArrowRight||K.KeyD||T.r?1:0)-(K.ArrowLeft||K.KeyA||T.l?1:0),!!(K.Space||T.d)];
function ai(c){
 const sp=Math.hypot(c.vx,c.vy),L=5+Math.floor(sp/70),j=(c.idx+L)%N,nx=-Math.sin(ang[j]),ny=Math.cos(ang[j]);
 const d=wrap(Math.atan2(C[j][1]+ny*c.lane-c.y,C[j][0]+nx*c.lane-c.x)-c.a);
 const turn=Math.abs(wrap(ang[(c.idx+16)%N]-ang[(c.idx+3)%N])),tv=560*c.skill*(1-Math.min(turn*.85,.6));
 const fwd=c.vx*Math.cos(c.a)+c.vy*Math.sin(c.a);
 return [fwd>tv?-.4:1,Math.max(-1,Math.min(1,d*2.4)),false]}
function phys(c,t,hb,dt){
 const fx=Math.cos(c.a),fy=Math.sin(c.a),rx=-fy,ry=fx;
 let vf=c.vx*fx+c.vy*fy,vl=c.vx*rx+c.vy*ry;c.slip=Math.abs(vl);
 vf+=t*(t>0?950:vf>20?1700:700)*dt*(c.off?.55:1);if(vf<-140)vf=-140;
 vf-=vf*(1.8+(c.off?2.6:0))*dt;if(hb)vf-=Math.sign(vf)*Math.min(Math.abs(vf),150*dt);
 vl*=Math.exp(-(hb?2.2:c.slip>160?5:c.off?5:13)*dt);
 const sf=Math.max(-1,Math.min(1,vf/220));
 c.a+=c.st*2.9*sf*(1.2-Math.abs(vf)/1100)*(hb?1.4:1)*dt;
 c.vx=vf*fx+vl*rx;c.vy=vf*fy+vl*ry;c.x+=c.vx*dt;c.y+=c.vy*dt}
function nav(c){let bi=c.idx,bd=1e18;
 for(let k=-30;k<=30;k++){const i=(c.idx+k+N)%N,dx=c.x-C[i][0],dy=c.y-C[i][1],d=dx*dx+dy*dy;if(d<bd){bd=d;bi=i}}
 let d=bi-c.idx;if(d>N/2)d-=N;if(d<-N/2)d+=N;c.cum+=d;c.idx=bi;c.dist=Math.sqrt(bd);c.off=c.dist>TW/2+8?1:0}
function respawn(c){c.x=C[c.idx][0];c.y=C[c.idx][1];c.a=ang[c.idx];c.vx=c.vy=0;c.stuck=0}
function skid(c){const fx=Math.cos(c.a),fy=Math.sin(c.a),rx=-fy,ry=fx,on=c.slip>110,
 p=[[c.x-fx*14+rx*9,c.y-fy*14+ry*9],[c.x-fx*14-rx*9,c.y-fy*14-ry*9]];
 if(on&&c.pv){sk.beginPath();for(let k=0;k<2;k++){sk.moveTo(c.pv[k][0],c.pv[k][1]);sk.lineTo(p[k][0],p[k][1])}sk.stroke()}c.pv=on?p:null}
function step(dt){
 if(state==='count'){cd-=dt;if(cd<=0){state='race';raceT=0;rf=0;msg=.9;lapN=-1;lapT=0;laps=[]}return}
 if(msg>0)msg-=dt;if(state==='race'){raceT+=dt;rf++}
 for(const c of cars){
  const human=c.pl&&c.fin==null&&state==='race',inp=human?pin():ai(c);
  c.st+=(inp[1]-c.st)*Math.min(1,dt*9);
  phys(c,inp[0],inp[2],dt);nav(c);skid(c);
  if(!c.pl){c.stuck=c.dist>TW*.9?c.stuck+1:0;if(c.stuck>150)respawn(c)}
  if(human){const L=Math.floor(c.cum/N);if(L>lapN){if(L>=1){laps.push(raceT-lapT);lapT=raceT}lapN=L}rec.push(c.x,c.y,c.a);if(c.slip>130&&Math.hypot(c.vx,c.vy)>150)dp+=(c.slip-110)*dt*.5}
  if(c.fin==null&&c.cum>=LAPS*N){c.fin=raceT;if(c.pl&&state==='race')results()}}
 for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
  if(d<34&&d>0){const o=(34-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;
   const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const q=rv*.6;a.vx+=q*nx;a.vy+=q*ny;b.vx-=q*nx;b.vy-=q*ny}}}
 const p=cars[0];cam.x+=(p.x+p.vx*.3-cam.x)*.1;cam.y+=(p.y+p.vy*.3-cam.y)*.1}
/* ui */
const sync=()=>document.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',String(cfg[s.dataset.k])===b.dataset.v)));
function scores(hl){const col=(h,a)=>`<div><h3>${h}</h3><ol>${a.length?a.map((e,i)=>`<li class="${hl&&hl.includes(e)?'me':''}"><span>${i+1}. ${ft(e.t)}</span><span>${e.d}</span></li>`).join(''):'<li><span>No times yet</span></li>'}</ol></div>`;return col('Fastest races',SC.r)+col('Fastest laps',SC.l)}
function gnote(){$('#hs').innerHTML=scores();$('#gon').disabled=!G;if(!G)cfg.ghost=0;$('#gnote').textContent=G?'Ghost replays your fastest finished race ('+ft(G.t)+').':'Finish a race to save a ghost you can race next time.';sync()}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const k=b.parentNode.dataset.k,v=b.dataset.v;cfg[k]=isNaN(+v)?v:+v;sync();if(k==='ai'||k==='diff'){setup()}});
function toMenu(){state='menu';$('#res').classList.add('hide');$('#menu').classList.remove('hide');document.body.classList.remove('racing');$('#msg').textContent='';setup();gnote()}
function start(){$('#menu').classList.add('hide');$('#res').classList.add('hide');document.activeElement.blur();setup();gh=cfg.ghost&&G?G:null;gp=gh?prep(gh.d):null;dsm=0;state='count';cd=3;document.body.classList.add('racing')}
$('#go').onclick=start;$('#again').onclick=start;$('#tomenu').onclick=toMenu;
function results(){
 const p=cars[0],t=p.fin,place=1+cars.filter(c=>c!==p&&c.fin!=null).length;let note='Drift points: '+Math.round(dp)+'.';
 const d8=new Date().toLocaleDateString(undefined,{day:'numeric',month:'short'}),hl=[];
 const add=(a,v)=>{const e={t:v,d:d8};a.push(e);a.sort((x,y)=>x.t-y.t);a.length=Math.min(a.length,5);if(a.includes(e))hl.push(e);return a.indexOf(e)};
 const rr=add(SC.r,t);laps.forEach(v=>add(SC.l,v));
 if(rr==0)note+=' New fastest race.';else if(rr>0)note+=' #'+(rr+1)+' on the race board.';
 const bl=Math.min(...laps);if(SC.l[0]&&SC.l[0].t===bl&&hl.includes(SC.l[0]))note+=' New fastest lap: '+ft(bl)+'.';
 try{localStorage.setItem('sideways-scores',JSON.stringify(SC))}catch(e){}
 if(gh)note+=t<gh.t?' You beat your ghost by '+(gh.t-t).toFixed(3)+'s.':' Your ghost won by '+(t-gh.t).toFixed(3)+'s.';
 if(!G||t<G.t){G={t,d:rec.map((v,i)=>Math.round(v*(i%3==2?100:10))/(i%3==2?100:10))};try{localStorage.setItem('sideways-ghost',JSON.stringify(G))}catch(e){}note+=' New ghost saved.'}
 const fin=cars.filter(c=>c.fin!=null).sort((a,b)=>a.fin-b.fin),left=cars.length-fin.length;
 $('#rt').textContent=['','1st place','2nd place','3rd place','4th place'][place];$('#rn').textContent=note;
 $('#rl').innerHTML=fin.map(c=>`<li class="${c.pl?'me':''}"><span>${c.name}</span><span>${ft(c.fin)}</span></li>`).join('')+(left?`<li><span>${left} still racing</span><span></span></li>`:'');
 $('#hs2').innerHTML=scores(hl);$('#res').classList.remove('hide')}
addEventListener('keydown',e=>{K[e.code]=1;if(/Arrow|Space/.test(e.code))e.preventDefault();
 if(e.code==='KeyR'&&state==='race'&&cars[0].fin==null)respawn(cars[0]);if(e.code==='Escape'&&state!=='menu')toMenu()});
addEventListener('keyup',e=>K[e.code]=0);addEventListener('blur',()=>{for(const k in K)K[k]=0});
document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;b.onpointerdown=e=>{T[k]=1;e.preventDefault()};['pointerup','pointercancel','pointerleave'].forEach(ev=>b['on'+ev]=()=>T[k]=0)});
/* ghost delta */
function prep(d){const n=d.length/3,p=new Float32Array(n);let idx=N-2,cum=-2,m=-1e9;
 for(let f=0;f<n;f++){const x=d[f*3],y=d[f*3+1];let bi=idx,bd=1e18;
  for(let k=-30;k<=30;k++){const i=(idx+k+N)%N,dx=x-C[i][0],dy=y-C[i][1],q=dx*dx+dy*dy;if(q<bd){bd=q;bi=i}}
  let e=bi-idx;if(e>N/2)e-=N;if(e<-N/2)e+=N;cum+=e;idx=bi;m=Math.max(m,cum);p[f]=m}
 return p}
function delta(){const p=cars[0].cum;let lo=0,hi=gp.length-1;if(p>gp[hi])return null;
 while(lo<hi){const m=(lo+hi)>>1;if(gp[m]>=p)hi=m;else lo=m+1}return raceT-lo/60}
/* render */
function car(x,y,a,col,al){cx.save();cx.translate(x,y);cx.rotate(a);cx.globalAlpha=al;
 cx.fillStyle='rgba(0,0,0,.28)';cx.beginPath();cx.roundRect(-17,-7,40,22,6);cx.fill();
 cx.fillStyle=col;cx.beginPath();cx.roundRect(-20,-11,40,22,6);cx.fill();
 cx.fillStyle='rgba(15,18,22,.85)';cx.fillRect(-4,-8,11,16);
 cx.fillStyle='#fff8d6';cx.fillRect(17,-9,3,5);cx.fillRect(17,4,3,5);cx.restore()}
function render(){
 cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle='#2f5a43';cx.fillRect(0,0,W,H);
 const z=Math.max(.45,Math.min(1.1,Math.min(W,H)/820));
 cx.setTransform(DPR*z,0,0,DPR*z,DPR*(W/2-cam.x*z),DPR*(H/2-cam.y*z));
 cx.drawImage(trk,0,0);cx.drawImage(skd,0,0);
 if(gh&&state!=='menu'){const f=Math.min(rf,gh.d.length/3-1)*3;if(state==='race'||state==='count')car(gh.d[f],gh.d[f+1],gh.d[f+2],'#dbe9ff',.5)}
 for(let i=cars.length-1;i>=0;i--)car(cars[i].x,cars[i].y,cars[i].a,cars[i].col,1);
 if(state==='menu')return;
 const p=cars[0],order=[...cars].sort((a,b)=>(a.fin!=null?a.fin-1e6:1e6)-(b.fin!=null?b.fin-1e6:1e6)||b.cum-a.cum);
 $('#pos').textContent=(order.indexOf(p)+1)+'/'+cars.length;
 $('#lap').textContent='Lap '+Math.min(LAPS,Math.max(1,Math.floor(p.cum/N)+1))+'/'+LAPS;
 $('#time').textContent=ft(Math.max(0,state==='race'?raceT:0));$('#spd').textContent=Math.round(Math.hypot(p.vx,p.vy)*.45)+' km/h';
